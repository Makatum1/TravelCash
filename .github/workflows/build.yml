name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Buscar y descomprimir ZIP
        run: |
          # Busca cualquier archivo .zip en la raíz sin importar su nombre
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Error: No se encontró ningún archivo .zip en la raíz del repositorio."
            exit 1
          fi
          echo "✅ Archivo encontrado: $ZIP_FILE"
          unzip "$ZIP_FILE" -d ./proyecto
          
          # Busca la carpeta donde está el gradlew (el motor de compilación)
          DIR=$(find ./proyecto -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "✅ Carpeta del proyecto: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y Compilar APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app-debug.apk"
