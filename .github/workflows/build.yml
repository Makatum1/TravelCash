name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ZIP y buscar Gradle
        run: |
          unzip source.zip -d ./proyecto
          # Este comando busca la carpeta donde está el gradlew
          DIR=$(find ./proyecto -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "La carpeta del proyecto es: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y Compilar APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # Busca el APK en cualquier carpeta donde se haya generado
          path: "**/app-debug.apk"
